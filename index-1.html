<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FileFlip – Free PDF, Image & Excel Tools Online</title>
<meta name="description" content="Free online tools: JPG to PDF, merge PDF, split PDF, compress images, Excel to CSV and more. Private: files never leave your device.">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f6f7fb;--card:#fff;--text:#1b1f2a;--muted:#667085;--brand:#2563eb;--line:#e4e7ee}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10131a;--card:#181c26;--text:#eef0f6;--muted:#9aa3b5;--brand:#5b8cff;--line:#2a3040}}
:root[data-theme="dark"]{--bg:#10131a;--card:#181c26;--text:#eef0f6;--muted:#9aa3b5;--brand:#5b8cff;--line:#2a3040}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;line-height:1.6}
a{color:var(--brand);text-decoration:none}
nav{display:flex;justify-content:space-between;align-items:center;padding:14px 20px;background:var(--card);border-bottom:1px solid var(--line)}
.logo{font-weight:800;font-size:1.2rem;color:var(--text)}.logo b{color:var(--brand)}
nav div a{margin-left:14px;font-size:.9rem;color:var(--muted)}
.hero{text-align:center;padding:36px 16px 12px}
.hero h1{margin:0 0 8px;font-size:clamp(1.6rem,5vw,2.4rem)}
.hero p{margin:0 auto;max-width:520px;color:var(--muted)}
main{max-width:900px;margin:0 auto;padding:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.tile{display:block;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;color:var(--text)}
.tile:hover{border-color:var(--brand)}
.tile .i{font-size:1.6rem}.tile h3{margin:6px 0 2px;font-size:1rem}.tile p{margin:0;font-size:.85rem;color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;max-width:640px;margin:0 auto}
.card h1{margin-top:0;font-size:1.5rem}
.drop{display:block;position:relative;border:2px dashed var(--line);border-radius:12px;padding:36px 12px;text-align:center;cursor:pointer;color:var(--muted)}
.drop input{position:absolute;top:0;left:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:0}
.opt{margin:12px 0}.opt label{display:block;font-size:.9rem;margin-bottom:4px}
.opt input,.opt select{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--text);font-size:1rem}
ul{list-style:none;padding:0;margin:12px 0}
li{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);font-size:.9rem;word-break:break-all}
.btn{width:100%;padding:12px;border:0;border-radius:10px;background:var(--brand);color:#fff;font-size:1rem;cursor:pointer}
.btn:disabled{opacity:.5}.sm{width:auto;padding:6px 12px;font-size:.85rem}
#msg{margin-top:10px;font-size:.9rem;color:var(--muted);min-height:1.4em}
.ad{margin:20px auto;max-width:640px;text-align:center;font-size:.75rem;color:var(--muted);border:1px dashed var(--line);padding:18px;border-radius:10px}
footer{text-align:center;color:var(--muted);font-size:.85rem;padding:24px 16px 36px}
footer a{margin:0 8px;color:var(--muted)}
nav{position:sticky;top:0;z-index:5;padding:14px max(20px,calc((100% - 1100px)/2))}
.hero{padding:48px 16px 20px}
.hero h1{font-size:clamp(1.9rem,6vw,3rem);line-height:1.15}
.hero h1 em{font-style:normal;color:var(--brand)}
.hero p{font-size:1.05rem;max-width:560px}
.badges{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:16px}
.badges span{background:var(--card);border:1px solid var(--line);border-radius:99px;padding:5px 12px;font-size:.82rem;color:var(--muted)}
main{max-width:1100px}
h2.cat{font-size:1.1rem;margin:28px 0 10px}
.grid{grid-template-columns:repeat(2,1fr)}
@media(min-width:700px){.grid{grid-template-columns:repeat(3,1fr)}}
@media(min-width:1000px){.grid{grid-template-columns:repeat(4,1fr)}}
.tile{transition:transform .15s,border-color .15s}
.tile:hover{transform:translateY(-2px)}
.tile .i{display:inline-flex;width:44px;height:44px;align-items:center;justify-content:center;background:var(--bg);border-radius:12px}
.feat{display:grid;gap:12px;margin:36px 0 8px}
@media(min-width:700px){.feat{grid-template-columns:repeat(3,1fr)}}
.feat div{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px}
.feat b{display:block;margin-bottom:4px}.feat span{font-size:.9rem;color:var(--muted)}
.rev{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;max-width:720px}
.rv{border-top:1px solid var(--line);padding:10px 0}.rv p{margin:4px 0 0}.st{color:#f59e0b}
.card{max-width:720px;padding:24px}
@media(min-width:700px){.card{padding:32px}}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body>
<nav><a class="logo" href="#/">File<b>Flip</b></a><div><a href="#/about">About</a><a href="#/contact">Contact</a></div></nav>
<main id="app"></main>
<footer><a href="#/privacy">Privacy Policy</a><a href="#/terms">Terms</a><a href="#/about">About</a><a href="#/contact">Contact</a><div style="margin-top:8px">© FileFlip. All processing happens in your browser.</div></footer>
<script>
var L=PDFLib,$=function(i){return document.getElementById(i)};
var PDF="application/pdf",IMG="image/*";
function pages(s,n){var r=[];s.split(",").forEach(function(p){var a=p.trim().split("-").map(Number);
if(!a[0])return;var e=a[1]||a[0];for(var i=a[0];i<=e&&i<=n;i++)r.push(i-1)});return r}
async function bmp(f){var b=await createImageBitmap(f),c=document.createElement("canvas");c.width=b.width;c.height=b.height;
var x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,c.width,c.height);x.drawImage(b,0,0);return c}
function blob(c,t,q){return new Promise(function(r){c.toBlob(r,t,q)})}
var base=function(f){return f.name.replace(/\.[^.]+$/,"")};
var T=[
{id:"jpg-to-pdf",i:"🖼️",n:"JPG to PDF",d:"Turn images into one PDF",acc:IMG,multi:1,min:1,btn:"Create PDF",
run:async function(fs){var p=await L.PDFDocument.create();for(var f of fs){var c=await bmp(f),e=await p.embedJpg(await(await blob(c,"image/jpeg",.92)).arrayBuffer());
p.addPage([c.width,c.height]).drawImage(e,{x:0,y:0,width:c.width,height:c.height})}
return[["images.pdf",new Blob([await p.save()],{type:PDF})]]}},
{id:"merge-pdf",i:"🔗",n:"Merge PDF",d:"Combine PDFs into one",acc:PDF,multi:1,min:2,btn:"Merge PDFs",
run:async function(fs){var o=await L.PDFDocument.create();for(var f of fs){var s=await L.PDFDocument.load(await f.arrayBuffer());
(await o.copyPages(s,s.getPageIndices())).forEach(function(q){o.addPage(q)})}
return[["merged.pdf",new Blob([await o.save()],{type:PDF})]]}},
{id:"split-pdf",i:"✂️",n:"Split PDF",d:"Extract chosen pages",acc:PDF,min:1,btn:"Extract pages",
o:{l:"Pages (example: 1-3,5)",t:"text",v:"1"},
run:async function(fs,v){var s=await L.PDFDocument.load(await fs[0].arrayBuffer()),o=await L.PDFDocument.create(),ix=pages(v,s.getPageCount());
if(!ix.length)throw 0;(await o.copyPages(s,ix)).forEach(function(q){o.addPage(q)});
return[[base(fs[0])+"-extract.pdf",new Blob([await o.save()],{type:PDF})]]}},
{id:"rotate-pdf",i:"🔄",n:"Rotate PDF",d:"Rotate all pages",acc:PDF,min:1,btn:"Rotate",
o:{l:"Rotate by",t:"select",c:["90","180","270"],v:"90"},
run:async function(fs,v){var d=await L.PDFDocument.load(await fs[0].arrayBuffer());
d.getPages().forEach(function(p){p.setRotation(L.degrees((p.getRotation().angle+Number(v))%360))});
return[[base(fs[0])+"-rotated.pdf",new Blob([await d.save()],{type:PDF})]]}},
{id:"pdf-to-jpg",i:"📄",n:"PDF to JPG",d:"Save each page as an image",acc:PDF,min:1,btn:"Convert to JPG",
run:async function(fs){pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
var d=await pdfjsLib.getDocument({data:await fs[0].arrayBuffer()}).promise,r=[];
for(var i=1;i<=d.numPages;i++){var p=await d.getPage(i),v=p.getViewport({scale:2}),c=document.createElement("canvas");c.width=v.width;c.height=v.height;
await p.render({canvasContext:c.getContext("2d"),viewport:v}).promise;r.push(["page-"+i+".jpg",await blob(c,"image/jpeg",.92)])}return r}},
{id:"image-converter",i:"🔁",n:"Image Converter",d:"JPG, PNG, WEBP",acc:IMG,multi:1,min:1,btn:"Convert",
o:{l:"Convert to",t:"select",c:["jpeg","png","webp"],v:"jpeg"},
run:async function(fs,v){var r=[];for(var f of fs)r.push([base(f)+"."+(v=="jpeg"?"jpg":v),await blob(await bmp(f),"image/"+v,.92)]);return r}},
{id:"compress-image",i:"📉",n:"Compress Image",d:"Make photos smaller",acc:IMG,multi:1,min:1,btn:"Compress",
o:{l:"Quality (10-90)",t:"number",v:"60"},
run:async function(fs,v){var r=[];for(var f of fs)r.push([base(f)+"-small.jpg",await blob(await bmp(f),"image/jpeg",Math.min(90,Math.max(10,v))/100)]);return r}},
{id:"resize-image",i:"📐",n:"Resize Image",d:"Change image width",acc:IMG,min:1,btn:"Resize",
o:{l:"New width in pixels",t:"number",v:"800"},
run:async function(fs,v){var c=await bmp(fs[0]),w=Math.max(16,Number(v)),k=document.createElement("canvas");k.width=w;k.height=Math.round(c.height*w/c.width);
k.getContext("2d").drawImage(c,0,0,k.width,k.height);return[[base(fs[0])+"-"+w+"px.jpg",await blob(k,"image/jpeg",.92)]]}},
{id:"excel-to-csv",i:"📊",n:"Excel to CSV",d:"First sheet to CSV",acc:".xlsx,.xls",min:1,btn:"Convert to CSV",
run:async function(fs){var w=XLSX.read(await fs[0].arrayBuffer());return[[base(fs[0])+".csv",new Blob([XLSX.utils.sheet_to_csv(w.Sheets[w.SheetNames[0]])],{type:"text/csv"})]]}},
{id:"csv-to-excel",i:"📈",n:"CSV to Excel",d:"CSV to XLSX file",acc:".csv",min:1,btn:"Convert to Excel",
run:async function(fs){var w=XLSX.read(await fs[0].text(),{type:"string"});return[[base(fs[0])+".xlsx",new Blob([XLSX.write(w,{bookType:"xlsx",type:"array"})])]]}}
];
var G={about:["About FileFlip","FileFlip offers free file tools for everyday work. Everything runs inside your browser, so your files stay on your device."],
privacy:["Privacy Policy","We do not upload, store or read your files. All conversions happen locally in your browser. We may use cookies for analytics and advertising (for example Google AdSense) as described by those providers."],
terms:["Terms of Use","This service is provided free and as is, without warranty. You are responsible for the files you convert and must have the right to use them."],
contact:["Contact","Questions or feedback? Email: your-email@yourdomain.com (replace with your real address)."]};
async function save(n,b){try{var d=window.claude?await window.claude.use("downloads"):null;if(d){await d.save({filename:n,data:b});return}}catch(e){if(e&&e.code==="declined")return}
var a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=n;a.click()}
function home(){document.title="FileFlip – Free PDF, Image & Excel Tools Online";
$("app").innerHTML='<div class="hero"><h1>Every file tool you need, <em>free</em></h1><p>PDF, image and Excel tools that run in your browser. No signup, no upload, no limits.</p><div class="badges"><span>100% free</span><span>Private</span><span>No signup</span></div></div><div class="ad">Ad space</div>'+
C.map(function(c){return'<h2 class="cat">'+c[0]+'</h2><div class="grid">'+c[1].map(function(id){return tile(T.filter(function(x){return x.id==id})[0])}).join("")+"</div>"}).join("")+
'<div class="feat"><div><b>Free forever</b><span>All tools are free to use, with no hidden limits.</span></div><div><b>Private by design</b><span>Your files stay on your device and are never uploaded.</span></div><div><b>Works everywhere</b><span>Phone, tablet or computer. Just open and use.</span></div></div>'+revHTML()}
var ENDPOINT="",REVIEWS=[];
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function stars(n){return"★★★★★".slice(0,n)+"☆☆☆☆☆".slice(0,5-n)}
function revHTML(){var n=REVIEWS.length,a=n?(REVIEWS.reduce(function(x,r){return x+r.s},0)/n).toFixed(1):"";
var ta='style="width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--text);font-size:1rem"';
return'<h2 class="cat">Reviews</h2><div class="rev">'+(n?'<p><b>'+a+'</b> / 5 · '+n+' reviews</p>'+REVIEWS.map(function(r){return'<div class="rv"><b>'+esc(r.n)+'</b> <span class="st">'+stars(r.s)+'</span><p>'+esc(r.t)+'</p></div>'}).join(""):'<p>'+(ENDPOINT?"No reviews yet. Be the first to share your experience!":"Reviews are coming soon.")+'</p>')+
(ENDPOINT?'<form onsubmit="return sendReview(event)"><div class="opt"><label>Your name</label><input name="name" required maxlength="40"></div><div class="opt"><label>Rating</label><select name="rating"><option>5</option><option>4</option><option>3</option><option>2</option><option>1</option></select></div><div class="opt"><label>Your review</label><textarea name="review" required maxlength="500" rows="3" '+ta+'></textarea></div><button class="btn">Submit review</button><div id="rm" style="margin-top:8px;font-size:.9rem;color:var(--muted)"></div></form>':'')+'</div>'}
async function sendReview(e){e.preventDefault();var f=e.target,m=$("rm");m.textContent="Sending...";
try{var r=await fetch(ENDPOINT,{method:"POST",headers:{Accept:"application/json"},body:new FormData(f)});if(!r.ok)throw 0;f.reset();m.textContent="Thank you! Your review will appear after approval."}
catch(x){m.textContent="Sorry, could not send. Please try again."}return false}
var C=[["PDF tools",["jpg-to-pdf","merge-pdf","split-pdf","rotate-pdf","pdf-to-jpg"]],["Image tools",["image-converter","compress-image","resize-image"]],["Excel tools",["excel-to-csv","csv-to-excel"]]];
function tile(t){return'<a class="tile" href="#/'+t.id+'"><div class="i">'+t.i+'</div><h3>'+t.n+'</h3><p>'+t.d+'</p></a>'}
function tool(t){document.title=t.n+" Online Free – FileFlip";var fs=[];
$("app").innerHTML='<div class="card"><h1>'+t.n+'</h1><label class="drop">Tap to choose '+(t.multi?"files":"a file")+'<input type="file" id="f" accept="'+t.acc+'"'+(t.multi?" multiple":"")+'></label><ul id="l"></ul><div id="o"></div><button class="btn" id="go" disabled>'+t.btn+'</button><div id="msg"></div><ul id="r"></ul></div><div class="ad">Ad space</div><h2 class="cat" style="max-width:720px;margin:24px auto 10px">More tools</h2><div class="grid" style="max-width:720px;margin:0 auto;grid-template-columns:repeat(2,1fr)">'+T.filter(function(x){return x.id!=t.id}).slice(0,4).map(tile).join("")+'</div><p style="text-align:center;margin-top:20px"><a href="#/">← All tools</a></p>';
if(t.o){var h='<div class="opt"><label>'+t.o.l+"</label>";h+=t.o.t=="select"?'<select id="v">'+t.o.c.map(function(c){return"<option>"+c+"</option>"}).join("")+"</select>":'<input id="v" type="'+t.o.t+'" value="'+t.o.v+'">';$("o").innerHTML=h+"</div>"}
$("f").onchange=function(e){fs=Array.from(e.target.files);$("l").innerHTML=fs.map(function(f){return"<li>"+f.name.replace(/</g,"&lt;")+"</li>"}).join("");$("go").disabled=fs.length<t.min};
$("go").onclick=async function(){var g=$("go");g.disabled=true;$("msg").textContent="Working...";$("r").innerHTML="";
try{var res=await t.run(fs,t.o?$("v").value:null);$("msg").textContent="Done! Tap Save:";
res.forEach(function(x){var li=document.createElement("li"),b=document.createElement("button");li.textContent=x[0];b.className="btn sm";b.textContent="Save";b.onclick=function(){save(x[0],x[1])};li.appendChild(b);$("r").appendChild(li)})}
catch(e){$("msg").textContent="Sorry, that did not work. Please check your file and try again."}g.disabled=false}}
function route(){var k=(location.hash.replace("#/","")||""),t=T.filter(function(x){return x.id==k})[0];window.scrollTo(0,0);
if(t)tool(t);else if(G[k]){document.title=G[k][0]+" – FileFlip";$("app").innerHTML='<div class="card"><h1>'+G[k][0]+"</h1><p>"+G[k][1]+"</p></div>"}else home()}
window.onhashchange=route;route();
</script>
</body>
</html>
